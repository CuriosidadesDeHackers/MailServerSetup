# ============================================================
# /etc/apache2/sites-available/mail.tudominio.com-ssl.conf
# VHost HTTPS con certificado Let's Encrypt
# ============================================================

<VirtualHost *:443>
    ServerName mail.tudominio.com

    DocumentRoot /var/lib/roundcube/public_html

    <Directory /var/lib/roundcube/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mail.tudominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mail.tudominio.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/mail.tudominio.com-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/mail.tudominio.com-ssl-access.log combined
</VirtualHost>
