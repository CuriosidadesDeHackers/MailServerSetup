# ============================================================
# /etc/apache2/sites-available/mail.tudominio.com.conf
# VHost HTTP — Sin redirect a HTTPS cuando Cloudflare está en
# modo Flexible (evita loop de redirección)
# ============================================================

<VirtualHost *:80>
    ServerName mail.tudominio.com

    DocumentRoot /var/lib/roundcube/public_html

    <Directory /var/lib/roundcube/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Necesario para renovación automática de Let's Encrypt
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/

    ErrorLog  ${APACHE_LOG_DIR}/mail.tudominio.com-error.log
    CustomLog ${APACHE_LOG_DIR}/mail.tudominio.com-access.log combined
</VirtualHost>
