# ============================================================
# /etc/dovecot/dovecot.conf — Dovecot 2.4 (Debian 13)
# IMPORTANTE: Dovecot 2.4 usa sintaxis completamente distinta
# a versiones anteriores. Esta config NO es compatible con 2.3.
# ============================================================

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp
listen = *

# ── Autenticación ────────────────────────────────────────────
auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb passwd-file {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/users
}

userdb passwd-file {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/users
  fields {
    uid = vmail
    gid = vmail
    home = /var/mail/vhosts/%{user|domain}/%{user|username}
  }
}

# ── Almacenamiento de correo ─────────────────────────────────
mail_driver = maildir
mail_home = /var/mail/vhosts/%{user|domain}/%{user|username}
mail_path = ~/Maildir

first_valid_uid = 5000

# ── TLS ─────────────────────────────────────────────────────
ssl = yes
ssl_server_cert_file = /etc/letsencrypt/live/mail.tudominio.com/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/mail.tudominio.com/privkey.pem

# ── Servicios ────────────────────────────────────────────────
service imap-login {
  inet_listener imap { port = 143 }
  inet_listener imaps { port = 993; ssl = yes }
}

# Socket para autenticación con Postfix
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service auth-worker { user = root }
